[project]
name = "testlens-demo"
version = "0.1.0"
description = "testlens 的手动验收项目：通过 / 故意失败 / 慢用例 / 跳过 / 覆盖率都有"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# uv run 默认会装 dev 组：pytest 是面板里 pytest_cmd 要跑的，
# testlens 是本仓库自己——demo 就是它的宿主项目，不是"拿外部工具来跑"
dev = ["pytest>=8", "pytest-cov>=5", "testlens"]

[tool.uv.sources]
# 用工作区里这份源码（editable），改完 testlens 立刻在 demo 里生效；
# 发版后想验证 PyPI 上的包，把这一行删掉、dev 组写 "testlens==0.4.5" 即可。
testlens = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["test"]
# 让 `pytest` 也能 import 到同目录的 shop/（console script 不会自动把 cwd 放进 sys.path）
pythonpath = ["."]

[tool.coverage.run]
# testlens 的覆盖率推导会读这里：数据文件放在本目录，和面板读的是同一个
data_file = ".coverage.demo"
