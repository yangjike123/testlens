<!-- testlens-template: 2 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测试脚本清单</title>
__STYLE__
</head>
<body>
<header>
  <div class="topbar">
    <h1>测试脚本清单</h1>
    <span class="config-chip" id="config-source"></span>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <button class="topbar-action" id="btn-run-all" disabled title="运行所有包的全部测试">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="6 4 20 12 6 20 6 4"></polygon>
        <line x1="3" y1="4" x2="3" y2="20"></line>
      </svg>
      全部执行
    </button>
    <div class="meta-line" id="sub"></div>
  </div>
  <div class="toolbar">
    <div class="segmented" id="views" role="tablist"></div>
    <span class="spacer"></span>
    <button id="btn-run" class="primary" disabled>运行选中</button>
    <button id="btn-pick-all" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="3"></rect>
        <polyline points="8 12 11 15 16 9"></polyline>
      </svg>
      全选本包
    </button>
    <button id="btn-unpick" class="ghost" disabled>取消选择</button>
    <button id="btn-confirm" class="ghost" disabled>标记已确认</button>
    <span class="divider"></span>
    <button id="btn-history" class="ghost">运行历史 <span class="tab-count" id="history-count">0</span></button>
    <button id="btn-coverage" class="ghost">覆盖率 <span class="tab-count" id="coverage-count">—</span></button>
  </div>
  <div class="notice" id="notice" hidden></div>
</header>
<main>
  <div class="search-bar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
    </svg>
    <input type="search" id="search"
           placeholder="按文件名搜索，例如 security、test_api" autocomplete="off">
    <span class="search-hint" id="search-hint"></span>
    <button class="copy-btn" id="btn-pick-visible" hidden>全选</button>
    <button class="ghost" id="btn-search-clear" hidden>清空</button>
  </div>
  <section id="content"></section>
</main>

<button id="drawer-handle" hidden title="打开运行面板" aria-label="打开运行面板">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <polyline points="4 17 10 11 4 5"></polyline>
    <line x1="12" y1="19" x2="20" y2="19"></line>
  </svg>
  <span class="handle-text"><i>运</i><i>行</i><i>面</i><i>板</i></span>
</button>
<div class="drawer" id="drawer" aria-hidden="true">
  <button class="drawer-collapse" id="btn-collapse" title="收起面板" aria-label="收起面板">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <div class="drawer-head">
    <div class="drawer-id">
      <div class="drawer-title">
        <span class="badge" id="run-badge">运行中</span>
        <span class="run-meta" id="run-meta"></span>
      </div>
    </div>
    <div class="drawer-actions">
      <a class="link" id="run-log" target="_blank" hidden>完整日志</a>
      <button class="copy-btn" id="btn-copy-run" hidden>复制输出</button>
      <button class="copy-btn danger" id="btn-stop" hidden>停止</button>
    </div>
  </div>
  <div class="drawer-nav">
    <div class="drawer-tabs">
      <button id="view-current" class="active">本次</button>
      <button id="view-history">历史</button>
      <button id="view-coverage">覆盖率</button>
    </div>
  </div>
  <div class="drawer-body">
    <div class="current-view" id="current-view">
      <div class="all-run" id="all-run" hidden>
        <div class="all-run-head">
          <span class="rs-dot" id="all-run-dot"></span>
          <span class="rs-text" id="all-run-text"></span>
          <span class="spacer"></span>
          <button class="rs-btn danger" id="btn-stop-all" hidden>停止全部</button>
        </div>
        <div class="all-run-items" id="all-run-items"></div>
      </div>
      <div class="run-summary" id="run-summary" hidden>
        <span class="rs-dot" id="run-summary-dot"></span>
        <span class="rs-text" id="run-summary-text"></span>
        <span class="rs-delta" id="run-summary-delta"></span>
        <span class="spacer"></span>
        <button class="rs-btn" id="btn-durations">耗时</button>
        <button class="rs-btn danger" id="btn-rerun-failed" hidden>只跑失败</button>
      </div>
      <pre id="run-output"></pre>
      <div class="run-durations" id="run-durations" hidden></div>
      <div class="run-empty" id="run-empty" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="4 17 10 11 4 5"></polyline>
        <line x1="12" y1="19" x2="20" y2="19"></line>
      </svg>
      <strong>还没有运行记录</strong>
        <span>在左侧勾选脚本，点「运行选中」，pytest 的输出会实时显示在这里。</span>
      </div>
    </div>
    <div class="history-view" id="history-view" hidden>
      <div class="history-list" id="history-list"></div>
      <div class="history-detail" id="history-detail"></div>
    </div>
    <div class="coverage-view" id="coverage-view" hidden>
      <div class="coverage-list" id="coverage-list"></div>
      <div class="coverage-detail" id="coverage-detail"></div>
    </div>
  </div>
</div>

__DATA_SCRIPT__
__SCRIPT__
</body>
</html>
